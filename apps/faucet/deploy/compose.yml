services:
  faucet:
    image: ghcr.io/ton-blockchain/faucet:${FAUCET_IMAGE_TAG:-master}
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    pull_policy: always
    env_file:
      - ./.env
    environment:
      VALKEY_URI: "redis://redis:6379"
      DATABASE_URL: "sqlite:///data/faucet/db.sqlite"
      ANTIFRAUD_DATABASE_URL: "sqlite:///data/antifraud/db.sqlite"
    volumes:
      - faucet-data:/data/faucet
      - faucet-antifraud:/data/antifraud
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # Keep direct access local so only the host reverse proxy can supply client IP headers.
      - "127.0.0.1:${FAUCET_PUBLIC_PORT:-3000}:3000"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "30"
        compress: "true"
    stop_grace_period: 1m
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  faucet-data:
  faucet-antifraud:
  redis-data:
