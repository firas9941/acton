[package]
name = "toncenter"
version = "2.1.15"
edition = "2024"
authors = ["TON Core"]
license = "MIT"
description = "Transport-independent TON Center API types and OpenAPI definitions"
repository = "https://github.com/ton-blockchain/acton"
documentation = "https://docs.rs/toncenter"
readme = "README.md"
keywords = ["ton", "toncenter", "blockchain", "openapi"]
categories = ["api-bindings", "cryptography::cryptocurrencies"]
include = ["src/**", "examples/**", "tests/**", "openapi.json", "openapi-v3.json", "README.md", "LICENSE-*", "Cargo.toml"]

[lib]
doctest = false

[features]
default = []
openapi = ["dep:utoipa"]
live-tests = ["openapi"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
expect-test = { workspace = true }
jsonschema = { workspace = true }
reqwest = { workspace = true }

[[example]]
name = "openapi"
required-features = ["openapi"]

[[test]]
name = "live"
required-features = ["live-tests"]

[[test]]
name = "live_v3"
required-features = ["live-tests"]

[package.metadata.docs.rs]
features = ["openapi"]

[lints]
workspace = true
